<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TFT 시즌19 모바일 배치툴</title>
<link rel="stylesheet" href="style.css">
</head><body><div id="app">
<header><h1>TFT 배치툴<small>시즌 19</small></h1>
<button class="ib" id="undo" onclick="undo()">↶</button><button class="ib" id="redo" onclick="redo()">↷</button><button class="ib" onclick="openShare()">공유</button><button class="ib" id="reset" onclick="resetB()">초기화</button></header>
<div id="traits"></div>
<div id="boardWrap"><div id="board"></div></div>
<div id="bar"></div>
<div id="drawer"><div id="trashMsg">여기에 놓으면 제거</div><div class="dh"><button class="tab on" data-t="c" onclick="setTab('c')">챔피언</button><button class="tab" data-t="i" onclick="setTab('i')">아이템</button><button class="ib" onclick="toggleFull()">⤢</button></div><div id="flt" class="flt"></div><div id="flt2" class="flt"></div><div id="body" class="body"></div></div>
<div id="modal" class="ov" onclick="if(event.target===this)closeShare()"><div class="box"><div class="ttl">덱 공유 코드</div><textarea id="code" readonly></textarea><div class="r"><button class="ib" onclick="copyCode()">코드 복사</button></div><div class="ttl" style="margin-top:14px">코드로 불러오기</div><textarea id="paste" placeholder="공유 코드를 붙여넣으세요"></textarea><div class="r"><button class="ib" onclick="loadCode()">불러오기</button><button class="ib" onclick="closeShare()">닫기</button></div></div></div>
<div id="sheet" class="ov" onclick="if(event.target===this)closeSheet()"><div class="box"><div id="sheetBody"></div><div class="r"><button class="ib" onclick="closeSheet()">닫기</button></div></div></div>
<div id="ghost"></div>
<div id="toast"></div></div>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body></html>
